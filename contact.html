<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | My Portfolio</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .contact-container {
            max-width: 650px;
            margin: 40px auto;
        }

        .contact-container h2 {
            margin-bottom: 10px;
        }

        .contact-form {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #999;
            border-radius: 4px;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid #800020;
            border-color: #800020;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .send-button {
            background-color: #800020;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .send-button:hover {
            background-color: #a00030;
        }

        .contact-note {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contacts</a>
        </nav>
    </header>

    <main>
        <section class="contact-container">

            <h2>Contact Me</h2>

            <p>
                Have a question or want to work together?
                Feel free to send me a message using the form below.
            </p>

            <form
                class="contact-form"
                action="https://formsubmit.co/YOUR_EMAIL@example.com"
                method="POST"
            >

                <input
                    type="hidden"
                    name="_subject"
                    value="New Message from My Portfolio"
                >

                <input
                    type="hidden"
                    name="_template"
                    value="table"
                >

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="What is your message about?"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Type your message here..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="send-button">
                    Send Message
                </button>

            </form>

            <p class="contact-note">
                You can also contact me directly through email.
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>

</body>
</html>
```
